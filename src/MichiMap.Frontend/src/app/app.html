<mat-toolbar color="primary" class="app-toolbar">
  <mat-icon class="toolbar-icon">map</mat-icon>
  <span class="toolbar-title">MichiMap</span>
  <span class="toolbar-subtitle">Michigan Natural Events</span>
  <span class="toolbar-spacer"></span>
  <button mat-button
          class="about-btn"
          (click)="toggleAbout()"
          matTooltip="About this app"
          aria-label="About MichiMap">
    <mat-icon>info_outline</mat-icon>
    <span class="about-btn-label">About</span>
  </button>
  <button mat-icon-button
          class="theme-toggle"
          (click)="toggleDarkMode()"
          [attr.aria-label]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
          [matTooltip]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
    <mat-icon>{{ darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>

<div class="filter-bar" role="group" aria-label="Filter events by type">
  @for (entry of layerEntries; track entry[0]) {
    <button
      class="filter-chip"
      [class.chip-dimmed]="isHidden(entry[0])"
      [style.--chip-color]="entry[1].color"
      (click)="toggleType(entry[0])"
      [attr.aria-pressed]="!isHidden(entry[0])"
      [attr.aria-label]="(isHidden(entry[0]) ? 'Show' : 'Hide') + ' ' + entry[1].label"
    >
      <span class="chip-icon">{{ entry[1].icon }}</span>
      <span class="chip-label">{{ entry[1].label }}</span>
    </button>
  }

  @if (hasActiveFilter()) {
    <button class="filter-chip chip-clear" (click)="clearFilters()" aria-label="Show all event types">
      <mat-icon class="chip-clear-icon">visibility</mat-icon>
      <span class="chip-label">Show all</span>
    </button>
  }
</div>

<div class="app-body">
  <app-map
    [activeTypes]="visibleTypes()"
    (eventSelected)="onEventSelected($event)"
  />

  @if (selectedEvent()) {
    <div class="sidebar-scrim" (click)="closePanel()" aria-hidden="true"></div>
    <app-sidebar [event]="selectedEvent()!" (closed)="closePanel()" />
  }
</div>

@if (showAbout()) {
  <div class="about-scrim" (click)="closeAbout()" aria-hidden="true"></div>
  <app-about-panel (closed)="closeAbout()" />
}
