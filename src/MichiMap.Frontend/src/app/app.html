<mat-toolbar color="primary" class="app-toolbar">
  <mat-icon class="toolbar-icon">map</mat-icon>
  <span class="toolbar-title">MichiMap</span>
  <span class="toolbar-subtitle">Michigan Natural Events</span>
  <span class="toolbar-spacer"></span>
  <button mat-stroked-button class="report-btn" (click)="openSubmitDialog()">
    <mat-icon>add</mat-icon>
    Report Sighting
  </button>
</mat-toolbar>

<div class="app-body">
  <app-map (eventSelected)="onEventSelected($event)" />

  @if (selectedEvent()) {
    <app-sidebar
      [event]="selectedEvent()!"
      (closed)="closePanel()"
    />
  }
</div>
